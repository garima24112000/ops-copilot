name: ops-copilot

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    container_name: ops-copilot-es
    environment:
      - node.name=es01
      - cluster.name=ops-copilot
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.license.self_generated.type=trial
      - xpack.ml.enabled=true
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  setup-kibana-user:
    image: curlimages/curl:8.11.0
    container_name: ops-copilot-setup-kibana-user
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-kibana_system_local_dev_pw}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        curl -sf -u elastic:$$ELASTIC_PASSWORD -X POST
        http://elasticsearch:9200/_security/user/kibana_system/_password
        -H 'Content-Type: application/json'
        -d "{\"password\":\"$$KIBANA_SYSTEM_PASSWORD\"}"
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.2
    container_name: ops-copilot-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
      setup-kibana-user:
        condition: service_completed_successfully
    environment:
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-kibana_system_local_dev_pw}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-a_32_char_minimum_local_dev_key_x}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-a_32_char_minimum_local_dev_key_x}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-a_32_char_minimum_local_dev_key_x}
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  apm-server:
    image: docker.elastic.co/apm/apm-server:9.5.2
    container_name: ops-copilot-apm
    depends_on:
      elasticsearch:
        condition: service_healthy
    user: root
    command: >
      -e
        -E apm-server.host=0.0.0.0:8200
        -E apm-server.auth.anonymous.enabled=true
        -E apm-server.auth.anonymous.allow_service=[]
        -E apm-server.auth.anonymous.allow_agent=[otlp,rum-js,js-base,iOS/swift]
        -E output.elasticsearch.hosts=["http://elasticsearch:9200"]
        -E output.elasticsearch.username=elastic
        -E output.elasticsearch.password=${ELASTIC_PASSWORD}
        -E apm-server.data_streams.enabled=true
        -E setup.kibana.host=http://kibana:5601
        -E setup.template.enabled=true
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8200/ | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  es-data:
