# Human-authored end-to-end golden set (session 14).
#
# Per CLAUDE.md / the operator's instructions: Claude Code did NOT write these tasks. Only a
# human should. Writing them yourself defeats the point -- a model-authored eval set tends to
# ask questions the retriever already answers well, which makes the reported numbers
# meaningless. Fill in the 10 stubs below with real, hand-picked alert scenarios (skim
# data/runbooks.jsonl for ones you know well, or invent a plausible one) BEFORE running
# `make e2e-eval` -- run_eval.py reports this subset separately from the generated one and
# will mark it PENDING with a note until every stub below is filled in.
#
# Field guide:
#   id                    - short unique slug, e.g. "human-01"
#   alert                 - the alert payload exactly as cli.py / agent/state.py's Alert
#                           TypedDict expects: service, severity, metric, message
#   expected_runbook_id   - the `id` field from data/runbooks.jsonl you'd want the agent to
#                           retrieve and ground its answer in (open the file, pick a real one)
#   expected_tool_sequence - the MCP tool names you'd expect the agent to call, in order, e.g.
#                           [search_runbooks, find_similar_incidents, query_service_health]
#                           (approve/act tools like restart_service or create_ticket only if
#                           you'd expect that alert to actually trigger one)
#   notes                 - optional: why you picked this one / what makes it a good test

tasks:
  - id: human-01
    alert:
      service: "etcd"
      severity: "critical"
      metric: "etcd_server_has_leader"
      message: "2 of 3 members reporting no leader for 90s; writes queuing, API latency climbing in gprd"
    expected_runbook_id: "promop-etcdNoLeader"
    expected_tool_sequence: [search_runbooks, find_similar_incidents, query_service_health]
    notes: "No etcd data in Loghub; expect diagnosis_confirmed false"

  - id: human-02
    alert:
      service: "kubernetes"
      severity: "warning"
      metric: "kube_pod_container_resource_requests_cpu_cores"
      message: "CPU requests at 112% of allocatable across gprd-us-east1; single node loss would leave pods unschedulable"
    expected_runbook_id: "promop-KubeCPUOvercommit"
    expected_tool_sequence: [search_runbooks, find_similar_incidents, query_service_health, create_ticket]
    notes: "Capacity-planning alert, not an outage; ticket is the right action"

  - id: human-03
    alert:
      service: "alertmanager"
      severity: "warning"
      metric: "alertmanager_config_last_reload_successful"
      message: "Reload flag stuck at 0 for 12m on alertmanager-main-1; config-reloader sidecar restarting in a loop"
    expected_runbook_id: "promop-AlertmanagerFailedReload"
    expected_tool_sequence: [search_runbooks, find_similar_incidents, query_service_health, create_ticket]
    notes: "Runbook warns against deleting pods; tests whether grounding survives into the action"

  - id: human-04
    alert:
      service: "kube-apiserver"
      severity: "critical"
      metric: "apiserver_client_certificate_expiration_seconds"
      message: "Shortest-lived client cert under 18h remaining for controller-manager serviceaccount in gstg"
    expected_runbook_id: "promop-KubeClientCertificateExpiration"
    expected_tool_sequence: [search_runbooks, find_similar_incidents, query_service_health, create_ticket]
    notes: "Time-bounded, not yet broken; correct action is a ticket, not a restart"

  - id: human-05
    alert:
      service: "node"
      severity: "warning"
      metric: "node_network_up"
      message: "eth0 on node-gprd-4 changed operstate 14 times in 5m; NFS mounts intermittently stalling"
    expected_runbook_id: "promop-NodeNetworkInterfaceFlapping"
    expected_tool_sequence: [search_runbooks, find_similar_incidents, query_service_health, create_ticket]
    notes: "Hardware-adjacent; no automated remediation is appropriate"

  - id: human-06
    alert:
      service: "kubernetes"
      severity: "warning"
      metric: "kube_deployment_status_replicas_available"
      message: "registry deployment holding 3 available against spec of 8 for 22m; rollout not progressing"
    expected_runbook_id: "promop-KubeDeploymentReplicasMismatch"
    expected_tool_sequence: [search_runbooks, find_similar_incidents, query_service_health, create_ticket]
    notes: "Straightforward match; a baseline case against the harder ones"

  - id: human-07
    alert:
      service: "prometheus"
      severity: "warning"
      metric: "up"
      message: "Scrape failures across several endpoints in gprd; gaps appearing in multiple dashboards"
    expected_runbook_id: "promop-TargetDown"
    expected_tool_sequence: [search_runbooks, find_similar_incidents, query_service_health, create_ticket]
    notes: "INTENDED HARD — deliberately vague, could plausibly match many runbooks"

  - id: human-08
    alert:
      service: "web"
      severity: "warning"
      metric: "apdex_ratio"
      message: "User-facing latency degraded on the web fleet; error budget burning faster than projected"
    expected_runbook_id: "gitlab-alerts-ApdexSLOViolation"
    expected_tool_sequence: [search_runbooks, find_similar_incidents, query_service_health, create_ticket]
    notes: "INTENDED HARD — generic SLO language; also tests cross-corpus retrieval into GitLab docs"

  - id: human-09
    alert:
      service: "blackbox"
      severity: "critical"
      metric: "probe_success"
      message: "4 of 12 external endpoints failing synthetic checks from the us-east prober for 10m"
    expected_runbook_id: "gitlab-blackbox-BlackboxProbeFailures"
    expected_tool_sequence: [search_runbooks, find_similar_incidents, query_service_health, create_ticket]
    notes: "GitLab-sourced doc with a different structure to the Prometheus templates"

  - id: human-10
    alert:
      service: "ai-gateway"
      severity: "critical"
      metric: "upstream_5xx_rate"
      message: "Primary model upstream returning 503s; traffic shedding to secondary, p95 up 3x"
    expected_runbook_id: "gitlab-ai-gateway-llm-provider-failover"
    expected_tool_sequence: [search_runbooks, find_similar_incidents, query_service_health, create_ticket]
    notes: "Mirrors this project's own router failover; good video material"