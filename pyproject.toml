[project]
name = "ops-copilot"
version = "0.1.0"
description = "Zero-cost autonomous IT incident-triage agent using Elasticsearch as brain, memory, and observability backend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "elasticsearch>=9.0,<10",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "fastmcp>=2.0",
    "sentence-transformers>=3.0",
    "google-genai>=0.3",
    "groq>=0.11",
    "ollama>=0.3",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "mcp_server", "security", "common"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["evals", "tests"]
pythonpath = ["."]
